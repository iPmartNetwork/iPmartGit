<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6ba3f8"/>
      <stop offset="100%" style="stop-color:#4f8ff7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="51%" style="stop-color:#4f8ff7"/>
      <stop offset="100%" style="stop-color:#4f8ff7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0e14" rx="64"/>
  
  <!-- Letter 'i' - vertical bar -->
  <rect x="135" y="175" width="18" height="155" rx="9" fill="url(#blueGrad)" opacity="0.9"/>
  
  <!-- Letter 'i' - dot -->
  <circle cx="144" cy="145" r="14" fill="#4f8ff7"/>
  
  <!-- Letter 'P' - vertical stroke -->
  <path d="M 180 130 L 180 330" stroke="url(#blueGrad)" stroke-width="18" stroke-linecap="round" fill="none"/>
  
  <!-- Letter 'P' - curve -->
  <path d="M 180 130 C 180 110, 200 100, 220 100 L 280 100 C 330 100, 350 125, 350 155 C 350 185, 330 210, 280 210 L 180 210" 
    stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
  
  <!-- Git branch - main line -->
  <line x1="265" y1="155" x2="265" y2="260" stroke="#4f8ff7" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Git branch - fork line -->
  <path d="M 265 180 C 280 180, 300 195, 310 210" stroke="#4f8ff7" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Git branch - another fork -->
  <path d="M 265 220 C 280 225, 290 245, 300 260" stroke="#4f8ff7" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Git nodes -->
  <circle cx="265" cy="155" r="8" fill="#4f8ff7"/>
  <circle cx="265" cy="210" r="6" fill="#6ba3f8"/>
  <circle cx="310" cy="212" r="6" fill="#6ba3f8"/>
  <circle cx="265" cy="260" r="6" fill="#6ba3f8"/>
  <circle cx="300" cy="262" r="6" fill="#4f8ff7"/>
  
  <!-- Text: iPmart -->
  <text x="148" y="410" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="bold" fill="#e0e0e0" letter-spacing="-1">iPmart</text>
  
  <!-- Text: Git -->
  <text x="330" y="410" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="bold" fill="#4f8ff7" letter-spacing="-1">Git</text>
  
  <!-- Subtle glow under text -->
  <ellipse cx="256" cy="425" rx="80" ry="4" fill="#4f8ff7" opacity="0.3"/>
</svg>
