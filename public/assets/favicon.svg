<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6ba3f8"/>
      <stop offset="100%" style="stop-color:#4f8ff7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0a0e14"/>
  
  <!-- Letter i - bar -->
  <rect x="14" y="22" width="5" height="28" rx="2.5" fill="url(#fg)"/>
  
  <!-- Letter i - dot -->
  <circle cx="16.5" cy="16" r="4" fill="#4f8ff7"/>
  
  <!-- Letter P - stroke -->
  <path d="M 25 14 L 25 52" stroke="url(#fg)" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Letter P - curve -->
  <path d="M 25 14 C 25 10, 30 8, 34 8 L 42 8 C 50 8, 54 13, 54 19 C 54 25, 50 30, 42 30 L 25 30" 
    stroke="url(#fg)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  
  <!-- Git nodes -->
  <circle cx="38" cy="19" r="3" fill="#4f8ff7"/>
  <circle cx="44" cy="35" r="2.5" fill="#6ba3f8"/>
  <circle cx="38" cy="42" r="2.5" fill="#6ba3f8"/>
  
  <!-- Git branch lines -->
  <line x1="38" y1="22" x2="44" y2="32" stroke="#4f8ff7" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="37" x2="38" y2="40" stroke="#4f8ff7" stroke-width="2" stroke-linecap="round"/>
</svg>
