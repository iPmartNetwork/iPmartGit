<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ریپازیتوری جدید - iPmartGit</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <img src="/assets/logo.svg" alt="iPmartGit" class="nav-logo">
        <span>iPmartGit</span>
      </a>
      <div class="nav-links">
        <a href="/dashboard" class="nav-link">داشبورد</a>
        <a href="/auth/logout" class="nav-link">خروج</a>
      </div>
    </div>
  </nav>

  <div class="form-container" style="max-width:600px;">
    <div class="form-card">
      <h2>ایجاد ریپازیتوری جدید</h2>
      <form id="newRepoForm">
        <div class="form-group">
          <label for="name">نام ریپازیتوری *</label>
          <input type="text" id="name" name="name" required pattern="[a-zA-Z0-9_.\-]+" placeholder="my-project">
          <small style="color:var(--text-muted);">فقط حروف انگلیسی، اعداد، نقطه، خط تیره و زیرخط</small>
        </div>
        <div class="form-group">
          <label for="description">توضیحات</label>
          <textarea id="description" name="description" rows="3" placeholder="توضیح کوتاه درباره پروژه..."></textarea>
        </div>
        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="is_private" name="is_private">
            <label for="is_private">ریپازیتوری خصوصی</label>
          </div>
          <small style="color:var(--text-muted);">ریپازیتوری‌های خصوصی فقط برای شما قابل مشاهده هستند</small>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:10px;">
          ایجاد ریپازیتوری
        </button>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('newRepoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const description = document.getElementById('description').value;
      const is_private = document.getElementById('is_private').checked;

      try {
        const data = await api('/repos/create', {
          method: 'POST',
          body: { name, description, is_private }
        });
        if (data.redirect) window.location.href = data.redirect;
      } catch (err) {
        showAlert(err.message);
      }
    });
  </script>
</body>
</html>
