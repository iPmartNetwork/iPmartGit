<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام - iPmartGit</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <img src="/assets/logo.svg" alt="iPmartGit" class="nav-logo">
        <span>iPmartGit</span>
      </a>
      <div class="nav-links">
        <a href="/auth/login" class="nav-link btn-outline">ورود</a>
      </div>
    </div>
  </nav>

  <div class="form-container">
    <div class="form-card">
      <h2>ثبت‌نام در iPmartGit</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="username">نام کاربری (انگلیسی)</label>
          <input type="text" id="username" name="username" required pattern="[a-zA-Z0-9_-]+" minlength="3" maxlength="30" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="display_name">نام نمایشی</label>
          <input type="text" id="display_name" name="display_name" placeholder="اختیاری">
        </div>
        <div class="form-group">
          <label for="email">ایمیل</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">رمز عبور (حداقل ۶ کاراکتر)</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="password_confirm">تکرار رمز عبور</label>
          <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:10px;">
          ثبت‌نام
        </button>
      </form>
      <div class="form-footer">
        قبلاً ثبت‌نام کرده‌اید؟ <a href="/auth/login">وارد شوید</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const display_name = document.getElementById('display_name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const password_confirm = document.getElementById('password_confirm').value;

      if (password !== password_confirm) {
        showAlert('رمز عبور و تکرار آن مطابقت ندارند');
        return;
      }

      try {
        const data = await api('/auth/register', {
          method: 'POST',
          body: { username, email, password, display_name }
        });
        if (data.redirect) window.location.href = data.redirect;
      } catch (err) {
        showAlert(err.message);
      }
    });
  </script>
</body>
</html>
