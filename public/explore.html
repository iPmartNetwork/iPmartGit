<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کاوش - iPmartGit</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <img src="/assets/logo.svg" alt="iPmartGit" class="nav-logo">
        <span>iPmartGit</span>
      </a>
      <div class="nav-search">
        <input type="text" id="searchInput" placeholder="جستجوی ریپازیتوری..." class="search-input">
      </div>
      <div class="nav-links" id="navLinks">
        <a href="/auth/login" class="nav-link btn-outline">ورود</a>
        <a href="/auth/register" class="nav-link btn-primary">ثبت‌نام</a>
      </div>
    </div>
  </nav>

  <div class="dashboard">
    <div class="dashboard-header">
      <h1>🔍 کاوش ریپازیتوری‌ها</h1>
    </div>

    <div id="repoList" class="repo-list">
      <div class="loading"><div class="spinner"></div></div>
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
      <h3>ریپازیتوری عمومی یافت نشد</h3>
      <p>اولین ریپازیتوری عمومی را ایجاد کنید!</p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    async function loadExplore() {
      // Check auth
      try {
        const user = await api('/auth/profile');
        document.getElementById('navLinks').innerHTML = `
          <a href="/repos/new" class="nav-link btn-outline">+ جدید</a>
          <a href="/dashboard" class="nav-link">${user.display_name || user.username}</a>
        `;
      } catch(e) {}

      // Get search param
      const params = new URLSearchParams(window.location.search);
      const search = params.get('search') || '';
      if (search) {
        document.getElementById('searchInput').value = search;
      }

      try {
        const url = search ? `/api/repos?search=${encodeURIComponent(search)}` : '/api/explore';
        const data = await fetch(url).then(r => r.json());
        const repos = Array.isArray(data) ? data : data.repos;
        const repoList = document.getElementById('repoList');

        if (!repos || repos.length === 0) {
          repoList.style.display = 'none';
          document.getElementById('emptyState').style.display = 'block';
          return;
        }

        repoList.innerHTML = repos.map(repo => `
          <a href="/${repo.owner_name}/${repo.name}" class="repo-card" style="text-decoration:none; color:inherit;">
            <div class="repo-card-header">
              <span class="repo-card-name">${repo.owner_name}/${repo.name}</span>
              ${repo.is_mirror ? '<span class="repo-card-badge mirror">میرور</span>' : ''}
            </div>
            ${repo.description ? `<p class="repo-card-desc">${repo.description}</p>` : ''}
            <div class="repo-card-meta">
              ${repo.language ? `<span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${getLanguageColor(repo.language)}"></span> ${repo.language}</span>` : ''}
              <span>⭐ ${repo.stars}</span>
              <span>📦 ${formatSize(repo.size)}</span>
              <span>${formatDate(repo.updated_at)}</span>
            </div>
          </a>
        `).join('');
      } catch (err) {
        document.getElementById('repoList').innerHTML = '<p class="alert alert-error">خطا در بارگذاری</p>';
      }
    }

    loadExplore();
  </script>
</body>
</html>
