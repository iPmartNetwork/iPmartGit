<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت - iPmartGit</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-container { max-width: 1280px; margin: 0 auto; padding: 30px 20px; }
    .admin-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border-color); margin-bottom: 24px; }
    .admin-tab { padding: 12px 20px; cursor: pointer; color: var(--text-secondary); border-bottom: 2px solid transparent; font-size: 0.95rem; }
    .admin-tab:hover { color: var(--text-primary); }
    .admin-tab.active { color: var(--text-primary); border-bottom-color: var(--accent-blue); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .stat-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; text-align: center; }
    .stat-card .number { font-size: 2rem; font-weight: 700; color: var(--accent-blue); }
    .stat-card .label { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }
    .data-table { width: 100%; border-collapse: collapse; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: hidden; }
    .data-table th, .data-table td { padding: 12px 16px; text-align: right; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    .data-table th { background: var(--bg-tertiary); color: var(--text-secondary); font-weight: 500; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--bg-tertiary); }
    .badge-admin { background: var(--accent-green); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <img src="/assets/logo.svg" alt="iPmartGit" class="nav-logo">
        <span>iPmartGit</span>
      </a>
      <div class="nav-links">
        <a href="/dashboard" class="nav-link">داشبورد</a>
        <a href="/settings" class="nav-link">⚙️</a>
        <a href="/auth/logout" class="nav-link">خروج</a>
      </div>
    </div>
  </nav>

  <div class="admin-container">
    <h1 style="margin-bottom:24px;">🛡️ پنل مدیریت</h1>

    <div id="statsGrid" class="stats-grid"></div>

    <div class="admin-tabs">
      <span class="admin-tab active" onclick="showAdminTab('users')">👥 کاربران</span>
      <span class="admin-tab" onclick="showAdminTab('repos')">📦 ریپازیتوری‌ها</span>
    </div>

    <div id="tabUsers"></div>
    <div id="tabRepos" style="display:none;"></div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    async function loadAdmin() {
      // Stats
      const stats = await api('/admin/stats');
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="number">${stats.users}</div><div class="label">کاربر</div></div>
        <div class="stat-card"><div class="number">${stats.repos}</div><div class="label">ریپازیتوری</div></div>
        <div class="stat-card"><div class="number">${stats.files}</div><div class="label">فایل</div></div>
        <div class="stat-card"><div class="number">${stats.issues}</div><div class="label">Issue</div></div>
        <div class="stat-card"><div class="number">${formatSize(stats.totalSize)}</div><div class="label">حجم کل</div></div>
      `;
      loadUsers();
    }

    async function loadUsers() {
      const users = await api('/admin/users');
      document.getElementById('tabUsers').innerHTML = `
        <table class="data-table">
          <thead><tr><th>نام کاربری</th><th>ایمیل</th><th>نام نمایشی</th><th>ریپازیتوری</th><th>تاریخ عضویت</th><th>عملیات</th></tr></thead>
          <tbody>
            ${users.map(u => `
              <tr>
                <td>${u.username} ${u.is_admin ? '<span class="badge-admin">ادمین</span>' : ''}</td>
                <td dir="ltr">${u.email}</td>
                <td>${u.display_name || '-'}</td>
                <td>${u.repo_count}</td>
                <td>${formatDate(u.created_at)}</td>
                <td>
                  <button class="btn btn-sm btn-outline" onclick="toggleAdmin(${u.id})">${u.is_admin ? 'حذف ادمین' : 'ادمین کن'}</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id}, '${u.username}')">حذف</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function loadRepos() {
      const repos = await api('/admin/repos');
      document.getElementById('tabRepos').innerHTML = `
        <table class="data-table">
          <thead><tr><th>نام</th><th>مالک</th><th>نوع</th><th>حجم</th><th>ستاره</th><th>آخرین بروزرسانی</th><th>عملیات</th></tr></thead>
          <tbody>
            ${repos.map(r => `
              <tr>
                <td><a href="/${r.owner_name}/${r.name}">${r.name}</a></td>
                <td>${r.owner_name}</td>
                <td>${r.is_private ? '🔒 خصوصی' : '🌐 عمومی'} ${r.is_mirror ? '🔄' : ''}</td>
                <td>${formatSize(r.size)}</td>
                <td>⭐ ${r.stars}</td>
                <td>${formatDate(r.updated_at)}</td>
                <td><button class="btn btn-sm btn-danger" onclick="adminDeleteRepo(${r.id}, '${r.name}')">حذف</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function showAdminTab(tab) {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tabUsers').style.display = tab === 'users' ? 'block' : 'none';
      document.getElementById('tabRepos').style.display = tab === 'repos' ? 'block' : 'none';
      if (tab === 'repos') loadRepos();
    }

    async function toggleAdmin(id) {
      try {
        await api(`/admin/users/${id}/admin`, { method: 'PUT' });
        loadUsers();
      } catch (err) { showAlert(err.message); }
    }

    async function deleteUser(id, username) {
      if (!confirm(`آیا از حذف کاربر "${username}" مطمئن هستید؟ تمام ریپازیتوری‌های او نیز حذف می‌شود.`)) return;
      try {
        await api(`/admin/users/${id}`, { method: 'DELETE' });
        loadUsers();
      } catch (err) { showAlert(err.message); }
    }

    async function adminDeleteRepo(id, name) {
      if (!confirm(`آیا از حذف ریپازیتوری "${name}" مطمئن هستید؟`)) return;
      try {
        await api(`/admin/repos/${id}`, { method: 'DELETE' });
        loadRepos();
      } catch (err) { showAlert(err.message); }
    }

    loadAdmin();
  </script>
</body>
</html>
