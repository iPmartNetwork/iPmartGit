<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروفایل کاربر - iPmartGit</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .profile-container { max-width: 1280px; margin: 0 auto; padding: 30px 20px; display: grid; grid-template-columns: 280px 1fr; gap: 30px; }
    .profile-sidebar { text-align: center; }
    .profile-avatar { width: 200px; height: 200px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 4rem; margin: 0 auto 16px; border: 3px solid var(--border-color); }
    .profile-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    .profile-username { color: var(--text-secondary); font-size: 1rem; margin-bottom: 12px; }
    .profile-bio { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 16px; line-height: 1.6; }
    .profile-stats { display: flex; justify-content: center; gap: 20px; padding: 16px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
    .profile-stat { text-align: center; }
    .profile-stat .num { font-weight: 700; color: var(--text-primary); }
    .profile-stat .lbl { font-size: 0.8rem; color: var(--text-muted); }
    .profile-joined { color: var(--text-muted); font-size: 0.85rem; }
    @media (max-width: 768px) { .profile-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <img src="/assets/logo.svg" alt="iPmartGit" class="nav-logo">
        <span>iPmartGit</span>
      </a>
      <div class="nav-search">
        <input type="text" id="searchInput" placeholder="جستجوی ریپازیتوری..." class="search-input">
      </div>
      <div class="nav-links" id="navLinks">
        <a href="/auth/login" class="nav-link btn-outline">ورود</a>
      </div>
    </div>
  </nav>

  <div class="profile-container">
    <aside class="profile-sidebar" id="profileSidebar">
      <div class="loading"><div class="spinner"></div></div>
    </aside>
    <main id="profileContent">
      <div class="loading"><div class="spinner"></div></div>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const username = window.location.pathname.split('/').filter(Boolean)[0];

    async function loadProfile() {
      // Check auth
      try {
        const currentUser = await api('/auth/profile');
        document.getElementById('navLinks').innerHTML = `
          <a href="/repos/new" class="nav-link btn-outline">+ جدید</a>
          <a href="/dashboard" class="nav-link">${currentUser.display_name || currentUser.username}</a>
        `;
      } catch(e) {}

      try {
        const data = await api(`/api/users/${username}`);
        document.title = `${data.display_name || data.username} - iPmartGit`;

        // Sidebar
        document.getElementById('profileSidebar').innerHTML = `
          <div class="profile-avatar">👤</div>
          <div class="profile-name">${data.display_name || data.username}</div>
          <div class="profile-username">@${data.username}</div>
          ${data.bio ? `<div class="profile-bio">${data.bio}</div>` : ''}
          <div class="profile-stats">
            <div class="profile-stat"><div class="num">${data.repos.length}</div><div class="lbl">ریپازیتوری</div></div>
            <div class="profile-stat"><div class="num">${data.starCount}</div><div class="lbl">ستاره داده</div></div>
          </div>
          <div class="profile-joined">📅 عضویت: ${new Date(data.created_at).toLocaleDateString('fa-IR')}</div>
        `;

        // Repos
        if (data.repos.length === 0) {
          document.getElementById('profileContent').innerHTML = `
            <h2 style="margin-bottom:20px;">ریپازیتوری‌ها</h2>
            <div class="empty-state"><p>هنوز ریپازیتوری عمومی ندارد</p></div>
          `;
        } else {
          document.getElementById('profileContent').innerHTML = `
            <h2 style="margin-bottom:20px;">ریپازیتوری‌ها (${data.repos.length})</h2>
            <div class="repo-list">
              ${data.repos.map(repo => `
                <a href="/${repo.owner_name}/${repo.name}" class="repo-card" style="text-decoration:none; color:inherit;">
                  <div class="repo-card-header">
                    <span class="repo-card-name">${repo.name}</span>
                    ${repo.is_mirror ? '<span class="repo-card-badge mirror">میرور</span>' : ''}
                  </div>
                  ${repo.description ? `<p class="repo-card-desc">${repo.description}</p>` : ''}
                  <div class="repo-card-meta">
                    ${repo.language ? `<span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${getLanguageColor(repo.language)}"></span> ${repo.language}</span>` : ''}
                    <span>⭐ ${repo.stars}</span>
                    <span>${formatDate(repo.updated_at)}</span>
                  </div>
                </a>
              `).join('')}
            </div>
          `;
        }
      } catch (err) {
        document.getElementById('profileSidebar').innerHTML = '';
        document.getElementById('profileContent').innerHTML = `
          <div class="empty-state">
            <h3>کاربر یافت نشد</h3>
            <a href="/" class="btn btn-primary" style="margin-top:20px;">بازگشت</a>
          </div>
        `;
      }
    }

    loadProfile();
  </script>
</body>
</html>
